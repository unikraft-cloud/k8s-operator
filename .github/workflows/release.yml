name: release

on:
  push:
    branches:
      - prod-staging
      - prod-stable
      - petar-cvit/ci/release-k8s-operator # remove

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Semantic Version
        id: semrel
        run: |
          if [[ "${GITHUB_REF_NAME}" == "prod-staging" ]]; then
            VERSION=$(make --no-print-directory next-staging)
          elif [[ "${GITHUB_REF_NAME}" == "petar-cvit/ci/release-k8s-operator" ]]; then
            VERSION=$(make --no-print-directory next-staging)
          elif [[ "${GITHUB_REF_NAME}" == "prod-stable" ]]; then
            VERSION=$(make --no-print-directory next-stable)
          else
            echo "Unsupported branch: ${GITHUB_REF_NAME}"
            exit 1
          fi

          git config user.name "Unikraft Bot"
          git config user.email "monkey@unikraft.com"
          git tag -a "${VERSION}" -m "${VERSION}"
          git push -u origin "${VERSION}"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
