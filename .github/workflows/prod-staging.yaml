name: prod-staging

on:
  workflow_dispatch:

  push:
    branches: [prod-staging]

jobs:
  promote:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: prod-stable

      - name: Reset promotion branch
        run: |
          git fetch origin prod-staging:prod-staging
          git reset --hard prod-staging

      - name: Create pull request
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          token: ${{ secrets.GH_PAT }}
          base: prod-stable
          title: "promote: Merge latest prod-staging changes to prod-stable"
          branch: prod-staging
