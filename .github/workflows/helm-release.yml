name: release/helm

on:
  push:
    branches:
      - prod-staging
    paths:
      - 'charts/**'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.0

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package Helm chart
        run: |
          helm package charts/k8s-operator --destination ./_packages

      - name: Push Helm chart to GHCR
        run: |
          CHART_PACKAGE=$(ls ./_packages/*.tgz)
          helm push "$CHART_PACKAGE" oci://ghcr.io/unikraft-cloud/helm-charts
