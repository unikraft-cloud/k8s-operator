---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: instances.unikraft.com
spec:
  group: unikraft.com
  names:
    kind: Instance
    listKind: InstanceList
    plural: instances
    singular: instance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.status
      name: Sync status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Instance is the Schema for the instances API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: The request message for creating a new instance.
            properties:
              annotations:
                additionalProperties:
                  type: string
                description: |-
                  Annotations to associate with the instance.

                  Unlike tags, annotations also reach the guest: they are included in the
                  instance's startdata, and selected keys can be injected into the console
                  log output.

                  Keys follow the Kubernetes annotation key syntax, `[<prefix>/]<name>`:
                  the optional prefix is a non-wildcard DNS subdomain of at most 253
                  characters, and the name is at most 63 characters of `[-_.a-zA-Z0-9]`
                  starting and ending with an alphanumeric. Values are unconstrained apart
                  from ASCII control characters. An instance holds at most 256 annotations.

                  When the instance inherits annotations from a template, branch, or
                  checkpoint, the given annotations are merged into them rather than
                  replacing them. On a key clash the value given here wins.
                type: object
              args:
                description: The arguments to pass to the instance when it starts.
                items:
                  type: string
                type: array
              autokill:
                description: |-
                  Automatic delete-on-idle/request-limit configuration. Not used for
                  template instances.
                properties:
                  num_requests:
                    description: |-
                      Maximum number of requests/connections the instance serves before it is
                      deleted. A value of 0 disables request-based autokill.
                    format: int32
                    type: integer
                  time_ms:
                    description: |-
                      Time in milliseconds after the instance was stopped before it is deleted.
                      A value of 0 disables time-based autokill.
                    format: int64
                    type: integer
                type: object
              autostart:
                description: |-
                  Whether the instance should start automatically on creation.
                  Must be set to true when `timeout_s` is specified.
                type: boolean
              branch_from:
                description: |-
                  Reference to an existing instance to branch from. The instance can be
                  running or stopped. If the source instance is running, a snapshot will be
                  taken asynchronously and the new instance will wait for it to complete
                  before starting. Mutually exclusive with `image` and `template`.
                properties:
                  name:
                    description: The name of the resource.
                    type: string
                  uuid:
                    description: The UUID of the resource.
                    type: string
                type: object
              checkpoint:
                description: |-
                  Reference to an existing checkpoint to create the instance from. The
                  checkpoint must be in the `checkpoint` state. The new instance will be
                  created with the same configuration and state as the checkpoint. Mutually
                  exclusive with `image`, `template`, and `branch_from`.
                properties:
                  name:
                    description: The name of the resource.
                    type: string
                  uuid:
                    description: The UUID of the resource.
                    type: string
                type: object
              dependencies:
                description: |-
                  Dependencies of the instance.

                  A list of instance identifiers (name or UUID) that this instance depends
                  on. Dependencies define startup ordering and can be used to ensure that
                  prerequisite instances are running before this instance starts.
                items:
                  description: An identifier for a resource — either a name or a UUID,
                    but not both.
                  properties:
                    name:
                      description: The name of the resource.
                      type: string
                    uuid:
                      description: The UUID of the resource.
                      type: string
                  type: object
                type: array
              env:
                additionalProperties:
                  type: string
                description: Environment variables to set for the instance.
                type: object
              features:
                description: |-
                  Features to enable for the instance. Features are specific
                  configurations or capabilities that can be enabled for the
                  instance. The `scale-to-zero` and `delete-on-stop` features are
                  mutually exclusive.
                items:
                  description: |-
                    Features are specific configurations or capabilities that can be enabled for
                    the instance.

                    The list of available features to enable for the instance:

                    | Feature            | Description |
                    |--------------------|-------------|
                    | `delete-on-stop`   | The instance will be deleted when it is stopped. This is useful for instances that are not needed after they are stopped, such as temporary or ephemeral instances. Cannot be combined with a `restart_policy` other than `never`. |
                    | `nested-virt`      | Expose virtualization extensions to the guest, so that it can run virtual machines of its own. Requires the `nested_virt` permission. |
                  enum:
                  - delete-on-stop
                  - nested-virt
                  type: string
                type: array
              gateway:
                description: The default gateway to configure inside the guest.
                type: string
              gpus:
                description: |-
                  Number of GPUs to attach to the instance. Currently restricted to at most
                  1. Requires `type` to be `full` and a plan with GPU support. A GPU stays
                  assigned to the instance, even while stopped, until the instance is
                  deleted. Cannot be combined with `template`, `branch_from`, or
                  `checkpoint`.
                format: int32
                type: integer
              hostname:
                description: |-
                  The hostname of the instance.

                  If not provided, the hostname will be set to the instance name. The
                  hostname must be a valid DNS label (e.g., "my-instance") and is used for
                  internal DNS resolution within the Unikraft Cloud network.
                type: string
              image:
                description: |-
                  The image to use for the instance.

                  Either an image or a template must be specified. Accepts either a plain
                  image reference string (`"nginx:latest"`) or an object carrying additional
                  pull configuration (`{"url": "nginx:latest", "pull_policy": "always"}`).
                x-kubernetes-preserve-unknown-fields: true
              max_memory_mb:
                description: |-
                  Upper bound in MB for memory vertical scaling. Setting this or
                  `min_memory_mb` enables memory vertical scaling. Defaults to the user's
                  maximum memory limit. Must be higher than `min_memory_mb` by at least
                  the platform's memory block size. Cannot be used with templates that
                  have a snapshot, `branch_from` or `checkpoint`.
                format: int64
                type: integer
              max_vcpus:
                description: |-
                  Upper bound for vCPU vertical scaling. Setting this or `min_vcpus`
                  enables vCPU vertical scaling. Defaults to the user's maximum vCPU
                  limit. Must be higher than `min_vcpus`. Cannot be used with templates
                  that have a snapshot, `branch_from` or `checkpoint`.
                format: int32
                type: integer
              memory_mb:
                description: Memory in MB to allocate for the instance. Default is
                  128.
                format: int64
                type: integer
              min_memory_mb:
                description: |-
                  Lower bound in MB for memory vertical scaling. Setting this or
                  `max_memory_mb` enables memory vertical scaling, which is only supported
                  by microVM instances. The instance boots with this amount of memory, and
                  `memory_mb` selects the initial allocation within the bounds, defaulting
                  to `min_memory_mb`. Must be lower than `max_memory_mb`, and within the
                  user's memory limits. Cannot be used with templates that have a
                  snapshot, `branch_from` or `checkpoint`.
                format: int64
                type: integer
              min_vcpus:
                description: |-
                  Lower bound for vCPU vertical scaling. Setting this or `max_vcpus`
                  enables vCPU vertical scaling, which is only supported by microVM
                  instances. The instance boots with this number of vCPUs, and `vcpus`
                  selects the initial allocation within the bounds, defaulting to
                  `min_vcpus`. Must be lower than `max_vcpus`, and within the user's vCPU
                  limits. Cannot be used with templates that have a snapshot,
                  `branch_from` or `checkpoint`.
                format: int32
                type: integer
              name:
                description: |-
                  The name of the resource. If not provided, a random name is generated.
                  The name must be unique within the context of your account.
                type: string
              nameserver:
                description: The DNS resolver to configure inside the guest.
                type: string
              network_interfaces:
                description: Network interfaces to attach to the instance.
                items:
                  description: Network interface configuration for a new instance.
                  properties:
                    autoconfig:
                      description: Whether the guest configures the interface itself.
                        Defaults to true.
                      type: boolean
                    ip:
                      description: |-
                        The interface IP address in CIDR notation. Provide it together
                        with tap_name to bring your own interface.
                      type: string
                    mac:
                      description: |-
                        The interface MAC address. Provide it together with tap_name. Must be
                        a unicast address outside the platform's address pool.
                      type: string
                    name:
                      description: |-
                        The interface name. If omitted, Unikraft Cloud generates one as
                        <instance-name>-ethX, falling back to eth-<suffix> when the
                        instance name is too long.
                      type: string
                    relay:
                      description: Relay configuration for this interface.
                      properties:
                        name:
                          description: The name of the resource.
                          type: string
                        relay_dns:
                          description: |-
                            Whether the relay forwards DNS requests. Set to false
                            to let the default DNS server handle them instead.
                            Defaults to true.
                          type: boolean
                        uuid:
                          description: The UUID of the resource.
                          type: string
                      type: object
                    tap_name:
                      description: |-
                        The TAP device to attach the interface to. Provide it together
                        with ip.
                      type: string
                  type: object
                type: array
              node:
                description: |-
                  The name of the node to place the resource on. If not provided, the
                  platform picks one. Only accepted on metros that span multiple nodes.
                type: string
              plugins:
                description: |-
                  Plugins to attach to the instance. Plugins let you attach small helper
                  programs to an instance and reach each one over a direct, authenticated
                  HTTP endpoint. Each plugin loads from its own ROM image, mounts at
                  `/uk/plugins/<plugin_name>`, and is reachable at
                  `.../v1/instances/<uuid>/plugins/<plugin_name>/<path>`. At most 8 plugins
                  may be attached to an instance.
                items:
                  description: |-
                    A helper program attached to the instance and reachable over a direct,
                    authenticated HTTP endpoint. A plugin runs inside the instance next to
                    the main application, loads from its own ROM image, and answers requests
                    that the Unikraft Cloud API forwards to it.
                  properties:
                    authorization:
                      description: |-
                        How requests to the plugin endpoint are authenticated. Without it, the
                        platform API token of a user with access to the instance (`userdb`) is
                        required. The platform checks the token and strips it before forwarding
                        the request to the plugin.
                      properties:
                        token:
                          description: |-
                            The token that requests must present as `Authorization: Bearer <token>`.
                            Required for, and only allowed with, the `bearer` type.
                          type: string
                        type:
                          description: The authorization method.
                          enum:
                          - userdb
                          - bearer
                          type: string
                      type: object
                    config:
                      description: |-
                        Arbitrary JSON configuration that the platform passes to the plugin's
                        `init` program on `STDIN`. Any JSON value works, including a string, a
                        number, or an object.
                      type: object
                      x-kubernetes-preserve-unknown-fields: true
                    image:
                      description: |-
                        The plugin's image. The platform loads the image, mounts it at
                        `/uk/plugins/<plugin_name>`, and runs its `init` program when the plugin
                        starts. Accepts either a plain image reference string
                        (`"user/myplugin:latest"`) or an object carrying additional pull
                        configuration (`{"url": "user/myplugin:latest", "pull_policy": "always"}`).
                        Exactly one of `image` and `rom` must be set.
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: |-
                        The plugin name. It becomes the `<plugin_name>` segment in the plugin
                        endpoint (`.../plugins/<plugin_name>/<path>`). A plugin name has a
                        maximum length of 63 characters and contains only letters (`a`-`z`,
                        `A`-`Z`), digits (`0`-`9`), hyphen (`-`), and underscore (`_`).
                      type: string
                    rom:
                      description: |-
                        The plugin's image, under its former name. The platform still accepts
                        it and adds a deprecation warning to the response. Exactly one of
                        `image` and `rom` must be set.

                        Deprecated: Use `image` instead.
                      x-kubernetes-preserve-unknown-fields: true
                  required:
                  - name
                  type: object
                type: array
              replicas:
                description: |-
                  Number of additional replicas to create. The total number of instances
                  created is `replicas + 1`. Defaults to 0.
                format: int64
                type: integer
              restart_policy:
                description: |-
                  Restart policy for the instance. This defines how the instance
                  should behave when it stops or crashes. Cannot be combined with
                  the `delete-on-stop` feature.
                enum:
                - never
                - always
                - on-failure
                type: string
              roms:
                description: |-
                  Read-Only Memory (ROM) blobs to attach to the instance.
                  Unikraft Cloud supports the ability to attach Read-Only Memory (ROM) blobs
                  to instances. It allows you to create a general-purpose base image and
                  then customize individual instances by attaching code or data as separate
                  ROM blobs.
                items:
                  description: A ROM to attach when creating an instance.
                  properties:
                    at:
                      description: |-
                        The path at which the ROM should be automatically mounted inside the
                        instance. When set, the platform mounts the ROM device at the specified
                        path so the guest does not need to mount it manually. When omitted, the
                        ROM is exposed as a raw block device and the guest is responsible for
                        mounting it.
                      type: string
                    files:
                      description: |-
                        Inline files to use as the ROM content. When specified, the platform
                        creates an EROFS image from the provided files. Mutually exclusive with
                        `image`.
                      items:
                        description: An inline file entry represents a single file
                          within an image.
                        properties:
                          data:
                            description: The file data, encoded according to the encoding
                              field.
                            type: string
                          encoding:
                            description: The encoding of the data field. Defaults
                              to "text".
                            enum:
                            - text
                            - base64
                            type: string
                          path:
                            description: The file path within the image.
                            type: string
                        required:
                        - data
                        - path
                        type: object
                      type: array
                    image:
                      description: |-
                        The image of the ROM to use for the instance configuration. Mutually
                        exclusive with `files`. Accepts either a plain image reference string
                        (`"nginx:latest"`) or an object carrying additional pull configuration
                        (`{"url": "nginx:latest", "pull_policy": "always"}`).
                      x-kubernetes-preserve-unknown-fields: true
                    name:
                      description: The name of the ROM to use for the instance configuration.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              scale_to_zero:
                description: |-
                  Scale-to-zero configuration for the instance. Requires
                  `service_group` to be set. Cannot be combined with the
                  `delete-on-stop` feature.
                properties:
                  cooldown_time_ms:
                    description: |-
                      The cooldown time in milliseconds before the instance can be scaled to
                      zero again. This is useful to prevent rapid scaling to zero and back up,
                      which can lead to performance issues or resource exhaustion.
                    format: int32
                    type: integer
                  notify_time_ms:
                    description: |-
                      The notification time in milliseconds before the instance is scaled to
                      zero. This allows the instance to perform any necessary cleanup or state
                      saving before being scaled down.
                    format: int32
                    type: integer
                  policy:
                    description: The specific policy to use for scaling the instance
                      to zero.
                    enum:
                    - "off"
                    - "on"
                    - idle
                    type: string
                  stateful:
                    description: |-
                      Whether the instance should be stateful when scaled to zero. If set to
                      true, the instance will retain its state (e.g., RAM contents) when scaled
                      to zero. This is useful for instances that need to maintain their state
                      across scale-to-zero operations. If set to false, the instance will lose
                      its state when scaled to zero, and it will be restarted from scratch when
                      scaled back up.
                    type: boolean
                type: object
              sched_priority:
                description: |-
                  The scheduling priority for the instance. Only settable by
                  users with scheduling priority override permissions.
                enum:
                - normal
                - medium
                - high
                - admin
                type: string
              schedules:
                description: |-
                  Schedules for the instance. Scheduled operations let you automatically
                  start, stop, delete, or exec a command in the instance on a calendar-
                  based schedule. For `exec` schedules, set the `args` field to the command
                  and its arguments. Each instance stores its own schedules, and cloning
                  preserves them.
                items:
                  description: |-
                    A schedule defines when an action should be performed on an instance.

                    Each schedule specifies a name, a calendar expression following systemd
                    calendar event syntax, and an action (start, stop, delete, or exec).

                    Calendar expressions format:

                    [weekday] [[year-]month-day] [hour:minute[:second]]

                    Supported syntax:

                    - `*` - Any value
                    - `5` - Exact value
                    - `1..5` - Range
                    - `1..5/2` - Range with step
                    - `1,2,5` - Comma-separated list

                    Example: `*-*-* 09:00:00` - Every day at 09:00 UTC
                    Example: `Sat,Sun *-*-* 20:00:00` - Every Saturday and Sunday at 20:00 UTC
                  properties:
                    action:
                      description: The action to perform at the scheduled time.
                      enum:
                      - start
                      - stop
                      - delete
                      - exec
                      type: string
                    args:
                      description: |-
                        The command to execute when the action is `exec`.

                        Required and non-empty when `action` is `exec`, and rejected for any
                        other action, even when empty. Each element is a separate argument; the
                        first element is the executable. At most 128 arguments, and the encoded
                        command must fit in 1024 bytes.
                      items:
                        type: string
                      type: array
                    name:
                      description: |-
                        The name of the schedule.

                        Must be unique within an instance.
                      type: string
                    next_at:
                      description: |-
                        The timestamp of when the next scheduled action will occur.

                        This field is populated only in responses (not settable in requests).
                        Omitted if no next execution is scheduled.
                      format: date-time
                      type: string
                    when:
                      description: |-
                        The calendar expression specifying when the action should be performed.

                        Uses systemd calendar event syntax.
                        See https://www.man7.org/linux/man-pages/man7/systemd.time.7.html
                      type: string
                  required:
                  - name
                  - when
                  type: object
                type: array
              service_group:
                description: |-
                  The service group configuration when creating an instance.

                  When creating an instance, either a previously created (persistent)
                  service group can be referenced (either through its name or UUID), or a
                  new (ephemeral) service group can be created for the instance by
                  specifying the list of services it should expose and optionally the
                  domains it should use. Not used by template instances.
                properties:
                  domains:
                    items:
                      description: |-
                        The domain configuration for the service group. A domain defines a publicly
                        accessible domain name for the instance. If the domain name ends with a
                        period `.`, it must be a valid Fully Qualified Domain Name (FQDN), otherwise
                        it will become a subdomain of the target metro. The domain can be associated
                        with an existing certificate by specifying the certificate's name or UUID.
                        If no certificate is specified and a FQDN is provided, Unikraft Cloud will
                        automatically generate a new certificate for the domain based on Let's
                        Encrypt and seek to accomplish a DNS-01 challenge.
                      properties:
                        certificate:
                          description: |-
                            A reference to an existing certificate which can be used for the
                            specified domain. If unspecified, Unikraft Cloud will
                            automatically generate a new certificate for the domain based on Let's
                            Encrypt and seek to accomplish a DNS-01 challenge.
                          properties:
                            name:
                              description: The name of the resource.
                              type: string
                            uuid:
                              description: The UUID of the resource.
                              type: string
                          type: object
                        name:
                          description: |-
                            Publicly accessible domain name.

                            If this name ends in a period `.` it must be a valid Full Qualified
                            Domain Name (FQDN), e.g. `example.com.`; otherwise it will become a
                            subdomain of the target metro, e.g. `example` becomes
                            `example.fra0.unikraft.app`.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  hard_limit:
                    format: int32
                    type: integer
                  name:
                    description: The name of the resource.
                    type: string
                  services:
                    items:
                      description: |-
                        A service connects a public-facing port to an internal destination port on
                        which an application instance listens on. Additional handlers can be
                        defined for each published port in order to define how the service will
                        handle incoming connections and forward traffic from the Internet to your
                        application. For example, a service can be configured to terminate TLS
                        connections, redirect HTTP traffic, or enable HTTP mode for load balancing.
                      properties:
                        destination_port:
                          description: |-
                            The port number that the instance is listening on. This is the internal
                            port which Unikraft Cloud will forward traffic to.
                          format: int32
                          type: integer
                        handlers:
                          description: |-
                            Connection handlers to use for the service. Handlers define how the
                            service will handle incoming connections and forward traffic from the
                            Internet to your application. For example, a service can be configured
                            to terminate TLS connections, redirect HTTP traffic, or enable HTTP mode
                            for load balancing. You configure the handlers for every published
                            service port individually.
                          items:
                            description: |-
                              Connection handlers to use for the service.

                              Handlers define how the service will handle incoming connections and
                              forward traffic from the Internet to your application. For example, a
                              service can be configured to terminate TLS connections, redirect HTTP
                              traffic, or enable HTTP mode for load balancing. You configure the handlers
                              for every published service port individually.

                              There are currently 3 supported handlers:

                              | Handler    | Description |
                              |------------|-------------|
                              | `tls`      | Terminate the TLS connection at the Unikraft Cloud gateway using our wildcard certificate issued for the kraft.cloud domain. The gateway forwards the unencrypted traffic to your application. |
                              | `http`     | Enable HTTP mode on the load balancer to load balance on the level of individual HTTP requests. In this mode, only HTTP connections are accepted. If this option is not set the load balancer works in TCP mode and distributes TCP connections. |
                              | `redirect` | Redirect traffic from the source port to the destination port. |

                              Note that there is a set of constraints when publishing ports:

                              - Port 80: MUST have "http" and MUST not have "tls" set;
                              - Port 443: MUST have http and tls set;
                              - The `redirect` handler can only be set on port 80 (HTTP) to redirect to
                              port 443 (HTTPS);
                              - All other ports MUST have tls and MUST not have http set.
                            enum:
                            - tls
                            - http
                            - redirect
                            type: string
                          type: array
                        ip:
                          type: string
                        port:
                          description: |-
                            This is the public-facing port that the service will be accessible from
                            on the Internet.
                          format: int32
                          type: integer
                        protocol:
                          description: Protocol for a service.
                          enum:
                          - tcp
                          - udp
                          type: string
                      required:
                      - port
                      type: object
                    type: array
                  soft_limit:
                    format: int32
                    type: integer
                  uuid:
                    description: The UUID of the resource.
                    type: string
                type: object
              tags:
                description: Tags to associate with the instance.
                items:
                  type: string
                type: array
              template:
                description: |-
                  Template instances.
                  An existing instance can be saved as a template. This template is then
                  used to create new instances that inherit the exact configuration and
                  state the original instance had when the template was created.
                properties:
                  autokill:
                    description: |-
                      Automatic delete-on-idle configuration for the template. Only applies
                      when `prepare` is set.
                    properties:
                      time_ms:
                        description: |-
                          Time in milliseconds after the template was last used for cloning before
                          it is deleted. A value of 0 disables template autokill.
                        format: int64
                        type: integer
                    type: object
                  create_args:
                    description: |-
                      Configuration parameters to apply when building the new instance from the
                      source template.
                    properties:
                      annotations:
                        additionalProperties:
                          type: string
                        description: |-
                          The annotations associated with the instance.

                          Keys follow the Kubernetes annotation key syntax, `[<prefix>/]<name>`: the
                          optional prefix is a non-wildcard DNS subdomain of at most 253 characters,
                          and the name is at most 63 characters of `[-_.a-zA-Z0-9]` starting and
                          ending with an alphanumeric. Values are unconstrained apart from ASCII
                          control characters, which are rejected because they would corrupt the
                          console log output annotations can be forwarded to.

                          An instance holds at most 256 annotations.
                        type: object
                      args:
                        description: |-
                          The arguments passed to the instance when it was started. This is a
                          list of command-line arguments that were provided to the instance at
                          startup. These arguments can be used to configure the behavior of the
                          instance and its applications.
                        items:
                          type: string
                        type: array
                      autokill:
                        description: |-
                          Automatic delete-on-idle/request-limit configuration.
                          Not used for template instances.
                        properties:
                          num_requests:
                            description: |-
                              Maximum number of requests/connections the instance serves before it is
                              deleted. A value of 0 disables request-based autokill.
                            format: int32
                            type: integer
                          time_ms:
                            description: |-
                              Time in milliseconds after the instance was stopped before it is deleted.
                              A value of 0 disables time-based autokill.
                            format: int64
                            type: integer
                        type: object
                      boot_memory_mb:
                        description: |-
                          The amount of memory in megabytes the instance boots with. Only present
                          if memory vertical scaling is enabled for the instance.
                        format: int64
                        type: integer
                      boot_time_us:
                        description: |-
                          The boot time of the instance in microseconds. We take a pragmatic
                          approach is to define the boot time. We calculate this as the difference
                          in time between the moment the virtualization toolstack is invoked to
                          respond to a VM boot request and the moment the OS starts executing user
                          code (i.e., the end of the guest OS boot process). This is essentially the
                          time that a user would experience in a deployment, minus the application
                          initialization time, which we leave out since it is independent from the
                          OS.
                          Not used for template instances.
                        format: int64
                        type: integer
                      boot_vcpus:
                        description: |-
                          The number of vCPUs the instance boots with. Only present if vCPU
                          vertical scaling is enabled for the instance.
                        format: int32
                        type: integer
                      checkpoint_autokill:
                        description: |-
                          Checkpoint-specific automatic delete-on-idle configuration.
                          Only used for checkpoint instances.
                        properties:
                          time_ms:
                            description: |-
                              Time in milliseconds after the template was last used for cloning before
                              it is deleted. A value of 0 disables template autokill.
                            format: int64
                            type: integer
                        type: object
                      checkpoint_time_us:
                        description: |-
                          The time taken for the instance to reach the checkpoint state, measured
                          in microseconds from when the checkpoint was requested.
