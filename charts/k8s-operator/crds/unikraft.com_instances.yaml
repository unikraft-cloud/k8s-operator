                            microseconds.  This field is primarily used for debugging and performance
                            analysis purposes.
                            Not used for template instances.
                          format: int64
                          type: integer
                        volumes:
                          description: The list of volumes attached to the instance.
                          items:
                            properties:
                              at:
                                description: |-
