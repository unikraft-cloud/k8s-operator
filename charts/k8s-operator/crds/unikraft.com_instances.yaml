---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: instances.unikraft.com
spec:
  group: unikraft.com
  names:
    kind: Instance
    listKind: InstanceList
    plural: instances
    singular: instance
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .spec.image
      name: Image
      type: string
    - jsonPath: .status.status
      name: Sync status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Instance is the Schema for the instances API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              args:
                description: (Optional).  The arguments to pass to the instance when
                  it starts.
                items:
                  type: string
                type: array
              autokill:
                properties:
                  num_requests:
                    description: |-
                      Maximum number of requests/connections the instance serves before it is
                      deleted. A value of 0 disables request-based autokill.
                    format: int32
                    type: integer
                  time_ms:
                    description: |-
                      Time in milliseconds after the instance was stopped before it is deleted.
                      A value of 0 disables time-based autokill.
                    format: int64
                    type: integer
                type: object
              autostart:
                description: |-
                  Whether the instance should start automatically on creation.
                  Must be set to true when `timeout_s` is specified.
                type: boolean
              branch_from:
                properties:
                  name:
                    description: Mutually exclusive with UUID.
                    type: string
                  uuid:
                    description: Mutually exclusive with name.
                    type: string
                required:
                - name
                - uuid
                type: object
              checkpoint:
                properties:
                  name:
                    description: Mutually exclusive with UUID.
                    type: string
                  uuid:
                    description: Mutually exclusive with name.
                    type: string
                required:
                - name
                - uuid
                type: object
              dependencies:
                description: |-
                  (Optional).  Dependencies of the instance.

                  A list of instance identifiers (name or UUID) that this instance depends
                  on.  Dependencies define startup ordering and can be used to ensure that
                  prerequisite instances are running before this instance starts.
                items:
                  properties:
                    name:
                      description: Mutually exclusive with UUID.
                      type: string
                    uuid:
                      description: Mutually exclusive with name.
                      type: string
                  type: object
                type: array
              env:
                additionalProperties:
                  type: string
                description: (Optional).  Environment variables to set for the instance.
                type: object
              features:
                description: |-
                  Features to enable for the instance.  Features are specific
                  configurations or capabilities that can be enabled for the
                  instance.  The `scale-to-zero` and `delete-on-stop` features are
                  mutually exclusive.
                items:
                  description: "\tFeatures are specific configurations or capabilities
                    that can be enabled for\n\tthe instance.\n\n\tThe list of available
                    features to enable for the instance:\n\n\t| Feature          |
                    Description |\n\t|------------------|-------------|\n\t| `delete_on_stop`
                    | The instance will be deleted when it is stopped. This is useful
                    for instances that are not needed after they are stopped, such
                    as temporary or ephemeral instances. |"
                  enum:
                  - delete-on-stop
                  type: string
                type: array
              gateway:
                description: The default gateway to configure inside the guest.
                type: string
              hostname:
                description: |-
                  (Optional).  The hostname of the instance.

                  If not provided, the hostname will be set to the instance name.  The
                  hostname must be a valid DNS label (e.g., "my-instance") and is used for
                  internal DNS resolution within the Unikraft Cloud network.
                type: string
              image:
                properties:
                  credentials:
                    description: |-
                      Optional credentials for authenticating to an OCI registry.
                      Only valid for OCI registry URLs; the platform rejects this
                      field for non-OCI schemes.
                    type: string
                  headers:
                    additionalProperties:
                      type: string
                    description: Optional HTTP headers to send when fetching the image.
                    type: object
                  pull_policy:
                    description: |-
                      Controls when the image is pulled relative to what is already cached on
                      the node.
                    enum:
                    - always
                    - if_not_present
                    - never
                    type: string
                  url:
                    description: The image URL
                    type: string
                required:
                - url
                type: object
              memory_mb:
                description: (Optional).  Memory in MB to allocate for the instance.  Default
                  is 128.
                format: int64
                type: integer
              name:
                description: |-
                  (Optional).  The name of the instance.

                  If not provided, a random name will be generated.  The name must be unique.
                type: string
              nameserver:
                description: The DNS resolver to configure inside the guest.
                type: string
              network_interfaces:
                description: A list of one to four interfaces to attach
                items:
                  properties:
                    autoconfig:
                      description: Whether the guest configures the interface itself.
                        Defaults to true.
                      type: boolean
                    ip:
                      description: |-
                        The interface IP address in CIDR notation. Provide it together
                        with tap_name to bring your own interface.
                      type: string
                    name:
                      description: |-
                        The interface name. If omitted, Unikraft Cloud generates one as
                        <instance-name>-ethX, falling back to eth-<suffix> when the
                        instance name is too long.
                      type: string
                    relay:
                      properties:
                        name:
                          description: |-
                            Name of the existing interface to relay through.
                            Mutually exclusive with UUID.
                          type: string
                        relay_dns:
                          description: |-
                            Whether the relay forwards DNS requests. Set to false
                            to let the default DNS server handle them instead.
                            Defaults to true.
                          type: boolean
                        uuid:
                          description: |-
                            UUID of the existing interface to relay through.
                            Mutually exclusive with name.
                          type: string
                      type: object
                    tap_name:
                      description: |-
                        The TAP device to attach the interface to. Provide it together
                        with ip.
                      type: string
                  type: object
                type: array
              replicas:
                description: |-
                  (Optional).  Number of additional replicas to create.  The total
                  number of instances created is `replicas + 1`.  Defaults to 0.
                format: int64
                type: integer
              restart_policy:
                description: |-
                  Restart policy for the instance.  This defines how the instance
                  should behave when it stops or crashes.  Cannot be combined with
                  the `delete-on-stop` feature.
                enum:
                - never
                - always
                - on-failure
                type: string
              roms:
                description: |-
                  Read-Only Memory (ROM) blobs to attach to the instance.
                  Unikraft Cloud supports the ability to attach Read-Only Memory (ROM) blobs
                  to instances. It allows you to create a general-purpose base image and
                  then customize individual instances by attaching code or data as separate
                  ROM blobs.
                items:
                  properties:
                    at:
                      description: |-
                        (Optional).  The path at which the ROM should be automatically mounted
                        inside the instance.  When set, the platform mounts the ROM device at
                        the specified path so the guest does not need to mount it manually.
                        When omitted, the ROM is exposed as a raw block device and the guest is
                        responsible for mounting it.
                      type: string
                    files:
                      description: |-
                        (Optional).  Inline files to use as the ROM content.  When specified,
                        the platform creates an EROFS image from the provided files.
                        Mutually exclusive with `image`.
                      items:
                        properties:
                          data:
                            description: The file data, encoded according to the encoding
                              field.
                            type: string
                          encoding:
                            description: (Optional).  The encoding of the data field.  Defaults
                              to "text".
                            enum:
                            - text
                            - base64
                            type: string
                          path:
                            description: The file path within the image.
                            type: string
                        required:
                        - data
                        - path
                        type: object
                      type: array
                    image:
                      description: |-
                        (Optional).  The image of the ROM to use for the instance configuration.
                        Mutually exclusive with `files`.
                      type: string
                    name:
                      description: The name of the ROM to use for the instance configuration.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              scale_to_zero:
                properties:
                  cooldown_time_ms:
                    description: |-
                      The cooldown time in milliseconds before the instance can be scaled to
                      zero again.  This is useful to prevent rapid scaling to zero and back up,
                      which can lead to performance issues or resource exhaustion.
                    format: int32
                    type: integer
                  notify_time_ms:
                    description: |-
                      The notification time in milliseconds before the instance is scaled to
                      zero. This allows the instance to perform any necessary cleanup or state
                      saving before being scaled down.
                    format: int32
                    type: integer
                  policy:
                    description: The specific policy to use for scaling the instance
                      to zero.
                    enum:
                    - "off"
                    - "on"
                    - idle
                    type: string
                  stateful:
                    description: |-
                      Whether the instance should be stateful when scaled to zero. If set to
                      true, the instance will retain its state (e.g., RAM contents) when scaled
                      to zero.  This is useful for instances that need to maintain their state
                      across scale-to-zero operations.  If set to false, the instance will lose
                      its state when scaled to zero, and it will be restarted from scratch when
                      scaled back up.
                    type: boolean
                type: object
              sched_priority:
                description: |-
                  The scheduling priority for the instance. Only settable by
                  users with scheduling priority override permissions.
                enum:
                - normal
                - medium
                - high
                - admin
                type: string
              schedules:
                description: |-
                  (Optional).  Schedules for the instance.  Scheduled operations let you
                  automatically start, stop, delete, or exec a command in the instance on
                  a calendar-based schedule.  For `exec` schedules, set the `args` field
                  to the command and its arguments.  Each instance stores its own
                  schedules, and cloning preserves them.
                items:
                  properties:
                    action:
                      description: The action to perform at the scheduled time.
                      enum:
                      - start
                      - stop
                      - delete
                      - exec
                      type: string
                    args:
                      description: |-
                        The command to execute when the action is `exec`.

                        Required when `action` is `SCHEDULE_ACTION_EXEC`, ignored otherwise.
                        Each element is a separate argument; the first element is the executable.
                      items:
                        type: string
                      type: array
                    name:
                      description: |-
                        The name of the schedule.

                        Must be unique within an instance.
                      type: string
                    next_at:
                      description: |-
                        The timestamp of when the next scheduled action will occur.

                        This field is populated only in responses (not settable in requests).
                        Unix timestamp in seconds.  Omitted if no next execution is scheduled.
                      format: int64
                      type: integer
                    when:
                      description: |-
                        The calendar expression specifying when the action should be performed.

                        Uses systemd calendar event syntax.
                        See https://www.man7.org/linux/man-pages/man7/systemd.time.7.html
                      type: string
                  required:
                  - action
                  - name
                  - when
                  type: object
                type: array
              service_group:
                properties:
                  domains:
                    description: |-
                      If no existing (persistent) service group is specified via its
                      identifier, a new (ephemeral) service group can be created.  In addition
                      to the services it must expose, you can specify which domains it should
                      use too.
                    items:
                      properties:
                        certificate:
                          properties:
                            name:
                              description: Mutually exclusive with UUID.
                              type: string
                            uuid:
                              description: Mutually exclusive with name.
                              type: string
                          required:
                          - name
                          - uuid
                          type: object
                        name:
                          description: |-
                            Publicly accessible domain name.

                            If this name ends in a period `.` it must be a valid Full Qualified
                            Domain Name (FQDN), e.g. `example.com.`; otherwise it will become a
                            subdomain of the target metro, e.g. `example` becomes
                            `example.fra0.unikraft.app`.
                          type: string
                      required:
                      - name
                      type: object
                    type: array
                  hard_limit:
                    description: |-
                      The hard limit for the number of services that can be created in this
                      service group.
                    format: int32
                    type: integer
                  name:
                    description: |-
                      (Optional).  Reference an existing (persistent) service group by its
                      name.  Mutually exclusive with UUID.
                    type: string
                  services:
                    description: |-
                      If no existing service group identifier is provided, one or more new
                      (ephemeral, non-persistent) service(s) can be created with the following
                      definitions.
                    items:
                      properties:
                        destination_port:
                          description: |-
                            The port number that the instance is listening on.  This is the internal
                            port which Unikraft Cloud will forward traffic to.
                          format: int32
                          type: integer
                        handlers:
                          description: |-
                            Connection handlers to use for the service.  Handlers define how the
                            service will handle incoming connections and forward traffic from the
                            Internet to your application.  For example, a service can be configured
                            to terminate TLS connections, redirect HTTP traffic, or enable HTTP mode
                            for load balancing.  You configure the handlers for every published
                            service port individually.
                          items:
                            description: "\tConnection handlers to use for the service.
                              \ Handlers define how the service\n\twill handle incoming
                              connections and forward traffic from the Internet to\n\tyour
                              application.  For example, a service can be configured
                              to terminate TLS\n\tconnections, redirect HTTP traffic,
                              or enable HTTP mode for load balancing.\n\tYou configure
                              the handlers for every published service port individually.\n\n\tThere
                              are currently 3 supported handlers:\n\n\t| Handler    |
                              Description |\n\t|------------|-------------|\n\t| `tls`
                              \     | Terminate the TLS connection at the Unikraft
                              Cloud gateway using our wildcard certificate issued
                              for the kraft.cloud domain. The gateway forwards the
                              unencrypted traffic to your application. |\n\t| `http`
                              \    | Enable HTTP mode on the load balancer to load
                              balance on the level of individual HTTP requests. In
                              this mode, only HTTP connections are accepted. If this
                              option is not set the load balancer works in TCP mode
                              and distributes TCP connections. |\n\t| `redirect` |
                              Redirect traffic from the source port to the destination
                              port. |\n\n\tNote that there is a set of constraints
                              when publishing ports:\n\t- Port 80: MUST have \"http\"
                              and MUST not have \"tls\" set;\n\t- Port 443: MUST have
                              http and tls set;\n\t- The `redirect` handler can only
                              be set on port 80 (HTTP) to redirect to\n\t  port 443
                              (HTTPS);\n\t- All other ports MUST have tls and MUST
                              not have http set."
                            enum:
                            - tls
                            - http
                            - redirect
                            type: string
                          type: array
                        port:
                          description: |-
                            This is the public-facing port that the service will be accessible from
                            on the Internet.
                          format: int32
                          type: integer
                      required:
                      - port
                      type: object
                    type: array
                  soft_limit:
                    description: |-
                      The soft limit for the number of services that can be created in this
                      service group.
                    format: int32
                    type: integer
                  uuid:
                    description: |-
                      (Optional).  Reference an existing (persistent) service group by its
                      UUID.  Mutually exclusive with name.
                    type: string
                type: object
              tags:
                description: (Optional).  Tags to associate with the instance.
                items:
                  type: string
                type: array
              template:
                properties:
                  autokill:
                    properties:
                      time_ms:
                        description: |-
                          Time in milliseconds after the template was last used for cloning
                          before it is deleted. A value of 0 disables template autokill.
                        format: int64
                        type: integer
                    type: object
                  create_args:
                    properties:
                      args:
                        description: |-
                          The arguments passed to the instance when it was started.  This is a
                          list of command-line arguments that were provided to the instance at
                          startup.  These arguments can be used to configure the behavior of the
                          instance and its applications.
                        items:
                          type: string
                        type: array
                      autokill:
                        properties:
                          num_requests:
                            description: |-
                              Maximum number of requests/connections the instance serves before it is
                              deleted. A value of 0 disables request-based autokill.
                            format: int32
                            type: integer
                          time_ms:
                            description: |-
                              Time in milliseconds after the instance was stopped before it is deleted.
                              A value of 0 disables time-based autokill.
                            format: int64
                            type: integer
                        type: object
                      boot_time_us:
                        description: |-
                          The boot time of the instance in microseconds.  We take a pragmatic
                          approach is to define the boot time.  We calculate this as the difference
                          in time between the moment the virtualization toolstack is invoked to
                          respond to a VM boot request and the moment the OS starts executing user
                          code (i.e., the end of the guest OS boot process).  This is essentially the
                          time that a user would experience in a deployment, minus the application
                          initialization time, which we leave out since it is independent from the
                          OS.
                          Not used for template instances.
                        format: int64
                        type: integer
                      checkpoint_autokill:
                        properties:
                          time_ms:
                            description: |-
                              Time in milliseconds after the template was last used for cloning before
                              it is deleted. A value of 0 disables template autokill.
                            format: int64
                            type: integer
                        type: object
                      created_at:
                        description: The time the instance was created.
                        format: date-time
                        type: string
                      delete_lock:
                        description: If set to true, the instance cannot be deleted
                          until the lock is removed.
                        type: boolean
                      env:
                        additionalProperties:
                          type: string
                        description: Environment variables set for the instance.
                        type: object
                      error:
                        description: |-
                          An optional error code providing additional information about the status.
                          This field is only set when this message object is used as a response
                          message, and is useful when the status is not `success`.
                        format: int32
                        type: integer
                      exit_code:
                        description: |-
                          The application exit code.

                          This is the code which the application returns upon leaving its main entry
                          point.  The encoding of the exit code is application specific.  See the
                          documentation of the application for more details.  Usually, an exit code
                          of `0` indicates success / no failure.
                          Not used for template instances.
                        format: int32
                        type: integer
                      gateway:
                        description: The default gateway configured inside the guest.
                        type: string
                      image:
                        description: |-
                          The image used to create the instance.  This is a reference to the
                          Unikraft image that was used to create the instance.
                        type: string
                      memory_mb:
                        description: |-
                          The amount of memory in megabytes allocated for the instance.  This is the
                          total amount of memory that is available to the instance for its
                          operations.
                        format: int64
                        type: integer
                      message:
                        description: |-
                          An optional message providing additional information about the status.
                          This field is only set when this message object is used as a response
                          message, and is useful when the status is not `success`.
                        type: string
                      name:
                        description: |-
                          The name of the instance.

                          This is a human-readable name that can be used to identify the instance.
                          The name must be unique within the context of your account.  The name can
                          also be used to identify the instance in API calls.
                        type: string
                      nameserver:
                        description: The DNS resolver configured inside the guest.
                        type: string
                      net_time_us:
                        description: |-
                          This is the time it took for the user-level application to start listening
                          on a non-localhost port measured in microseconds.  This is the time from
                          when the instance started until it reasonably ready to start responding to
                          network requests.  This is useful for measuring the time it takes for the
                          instance to become operationally ready.
                          Not used for template instances.
                        format: int64
                        type: integer
                      network_interfaces:
                        description: |-
                          The network interfaces of the instance.
                          Not used for template instances.
                        items:
                          properties:
                            autoconfig:
                              description: |-
                                Whether the interface is automatically configured inside the guest
                                (IP address, routes, etc.).  When absent or true, autoconfiguration
                                is enabled.  Present and false when the guest is expected to
                                configure the interface manually.
                              type: boolean
                            mac:
                              description: The MAC address of the network interface.
                              type: string
                            name:
                              description: |-
                                The interface name. If omitted, Unikraft Cloud generates one as
                                <instance-name>-ethX, falling back to eth-<suffix> when the
                                instance name is too long.
                              type: string
                            private_ip:
                              description: |-
                                The private IP address of the network interface. This is the internal IP
                                address that is used for communication between instances within the same
                                network.
                              type: string
                            relay:
                              properties:
                                name:
                                  description: Name of the relay interface.
                                  type: string
                                relay_dns:
                                  description: |-
                                    Whether DNS traffic is relayed through this interface.
                                    Defaults to true.
                                  type: boolean
                                uuid:
                                  description: UUID of the relay interface.
                                  type: string
                              required:
                              - name
                              - relay_dns
                              - uuid
                              type: object
                            rx_bytes:
                              description: Amount of bytes received from interface.
                              format: int64
                              type: integer
                            rx_packets:
                              description: Count of packets received from interface
                              format: int64
                              type: integer
                            tap_name:
                              description: The TAP device to attach the interface.
                                Provide it together with ip.
                              type: string
                            tx_bytes:
                              description: Amount of bytes sent to interface.
                              format: int64
                              type: integer
                            tx_packets:
                              description: Count of packets sent to interface
                              format: int64
                              type: integer
                            uuid:
                              description: |-
                                The UUID of the network interface. This is a unique identifier for the
                                network interface that is generated when the instance is created.
                              type: string
                          required:
                          - mac
                          - private_ip
                          - rx_bytes
                          - rx_packets
                          - tx_bytes
                          - tx_packets
                          - uuid
                          type: object
                        type: array
                      private_fqdn:
                        description: |-
                          The internal hostname of the instance.  This address can be used privately
                          within the Unikraft Cloud network to access the instance.  It is not
                          accessible from the public Internet.
                        type: string
                      private_ip:
                        description: The private IP address of the instance.
                        type: string
                      restart:
                        properties:
                          attempt:
                            description: |-
                              Current restart attempt number. This is incremented each time the instance
                              is restarted automatically by the platform.
                            format: int32
                            type: integer
                          next_at:
                            description: Timestamp of the next scheduled restart attempt.
                            format: date-time
                            type: string
                        required:
                        - attempt
                        type: object
                      restart_count:
                        description: |-
                          The total number of times the instance has been restarted. This is a counter
                          that increments each time the instance has been restarted. This can be
                          useful for tracking the usage of the instance over time and/or for
                          debugging purposes.
                          Not used for template instances.
                        format: int64
                        type: integer
                      restart_policy:
                        description: |-
                          The restart configuration for the instance.

                          When an instance stops either because the application exits or the instance
                          crashes, Unikraft Cloud can auto-restart your instance.  Auto-restarts are
                          performed according to the restart policy configured for a particular
                          instance.

                          The policy can have the following values:

                          | Policy       | Description |
                          |--------------|-------------|
                          | `never`      | Never restart the instance (default). |
                          | `always`     | Always restart the instance when the stop is initiated from within the instance (i.e., the application exits or the instance crashes). |
                          | `on-failure` | Only restart the instance if it crashes. |

                          When an instance stops, the stop reason and the configured restart policy
                          are evaluated to decide if a restart should be performed.  Unikraft Cloud
                          uses an exponential back-off delay (immediate, 5s, 10s, 20s, 40s, ..., 5m)
                          to slow down restarts in tight crash loops.  If an instance runs without
                          problems for 10s the back-off delay is reset and the restart sequence ends.

                          The `restart.attempt` attribute reported in counts the number of restarts
                          performed in the current sequence.  The `restart.next_at` field indicates
                          when the next restart will take place if a back-off delay is in effect.

                          A manual start or stop of the instance aborts the restart sequence and
                          resets the back-off delay.
                        enum:
                        - never
                        - always
                        - on-failure
                        type: string
                      roms:
                        description: |-
                          Read-Only Memory (ROM) blobs to attach to the instance.
                          Unikraft Cloud supports the ability to attach Read-Only Memory (ROM) blobs
                          to instances. It allows you to create a general-purpose base image and
                          then customize individual instances by attaching code or data as separate
                          ROM blobs.
                        items:
                          properties:
                            at:
                              description: |-
                                (Optional).  The path at which the ROM should be automatically mounted
                                inside the instance.  When set, the platform mounts the ROM device at
                                the specified path so the guest does not need to mount it manually.
                                When omitted, the ROM is exposed as a raw block device and the guest is
                                responsible for mounting it.
                              type: string
                            files:
                              description: |-
                                (Optional).  Inline files to use as the ROM content.  When specified,
                                the platform creates an EROFS image from the provided files.
                                Mutually exclusive with `image`.
                              items:
                                properties:
