---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.16.5
  name: services.unikraft.com
spec:
  group: unikraft.com
  names:
    kind: Service
    listKind: ServiceList
    plural: services
    singular: service
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    - jsonPath: .status.data.service_groups[0].domains[*].fqdn
      name: FQDN
      type: string
    - jsonPath: .status.status
      name: Sync status
      type: string
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: Service is the Schema for the services API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            properties:
              autokill:
                properties:
                  time_ms:
                    description: |-
                      Time in milliseconds after the service group becomes empty before it is
                      deleted. A value of 0 disables autokill.
                    format: int64
                    type: integer
                type: object
              domains:
                description: Description of domains associated with the service group.
                items:
                  properties:
                    certificate:
                      properties:
                        name:
                          description: The name of the resource.
                          type: string
                        uuid:
                          description: The UUID of the resource.
                          type: string
                      required:
                      - name
                      - uuid
                      type: object
                    name:
                      description: |-
                        Publicly accessible domain name.  If this name ends in a period `.` it must
                        be a valid Full Qualified Domain Name (FQDN), otherwise it will become a
                        subdomain of the target metro.
                      type: string
                  required:
                  - name
                  type: object
                type: array
              hard_limit:
                description: |-
                  The hard limit defines the maximum number of concurrent requests that an
                  instance assigned to the this service can handle.

                  The load balancer will never assign more requests to a single instance.  In
                  case there are no other instances available, excess requests fail (i.e.,
                  they are blocked and not queued).
                format: int64
                type: integer
              name:
                description: |-
                  Name of the service group.  This is a human-readable name that can be used
                  to identify the service group.  The name must be unique within the context
                  of your account.  If no name is specified, a random name is generated for
                  you.  The name can also be used to identify the service group in API calls.
                type: string
              services:
                description: Description of exposed services.
                items:
                  properties:
                    destination_port:
                      description: |-
                        The port number that the instance is listening on.  This is the internal
                        port which Unikraft Cloud will forward traffic to.
                      format: int32
                      type: integer
                    handlers:
                      description: |-
                        Connection handlers to use for the service.  Handlers define how the
                        service will handle incoming connections and forward traffic from the
                        Internet to your application.  For example, a service can be configured
                        to terminate TLS connections, redirect HTTP traffic, or enable HTTP mode
                        for load balancing.  You configure the handlers for every published
                        service port individually.
                      items:
                        description: "\tConnection handlers to use for the service.
                          \ Handlers define how the service\n\twill handle incoming
                          connections and forward traffic from the Internet to\n\tyour
                          application.  For example, a service can be configured to
                          terminate TLS\n\tconnections, redirect HTTP traffic, or
                          enable HTTP mode for load balancing.\n\tYou configure the
                          handlers for every published service port individually.\n\n\tThere
                          are currently 3 supported handlers:\n\n\t| Handler    |
                          Description |\n\t|------------|-------------|\n\t| `tls`
                          \     | Terminate the TLS connection at the Unikraft Cloud
                          gateway using our wildcard certificate issued for the kraft.cloud
                          domain. The gateway forwards the unencrypted traffic to
                          your application. |\n\t| `http`     | Enable HTTP mode on
                          the load balancer to load balance on the level of individual
                          HTTP requests. In this mode, only HTTP connections are accepted.
                          If this option is not set the load balancer works in TCP
                          mode and distributes TCP connections. |\n\t| `redirect`
                          | Redirect traffic from the source port to the destination
                          port. |\n\n\tNote that there is a set of constraints when
                          publishing ports:\n\t- Port 80: MUST have \"http\" and MUST
                          not have \"tls\" set;\n\t- Port 443: MUST have http and
                          tls set;\n\t- The `redirect` handler can only be set on
                          port 80 (HTTP) to redirect to\n\t  port 443 (HTTPS);\n\t-
                          All other ports MUST have tls and MUST not have http set."
                        enum:
                        - tls
                        - http
                        - redirect
                        type: string
                      type: array
                    port:
                      description: |-
                        This is the public-facing port that the service will be accessible from
                        on the Internet.
                      format: int32
                      type: integer
                  required:
                  - port
                  type: object
                type: array
              soft_limit:
                description: |-
                  The soft limit is used by the Unikraft Cloud load balancer to decide when
                  to wake up another standby instance.

                  For example, if the soft limit is set to 5 and the service consists of 2
                  standby instances, one of the instances receives up to 5 concurrent
                  requests.  The 6th parallel requests wakes up the second instance.  If
                  there are no more standby instances to wake up, the number of requests
                  assigned to each instance will exceed the soft limit.  The load balancer
                  makes sure that when the number of in-flight requests goes down again,
                  instances are put into standby as fast as possible.
                format: int64
                type: integer
            required:
            - services
            type: object
            x-kubernetes-validations:
            - message: spec.name is immutable
              rule: (!has(oldSelf.name) && !has(self.name)) || (has(oldSelf.name)
                && has(self.name) && self.name == oldSelf.name)
          status:
            properties:
              data:
                properties:
                  service_groups:
                    description: |-
                      The service group which was created by this request.

                      Note: only one service group can be specified in the request, so this
                      will always contain a single entry.
                    items:
                      properties:
                        autokill:
                          properties:
                            time_ms:
                              description: |-
                                Time in milliseconds after the service group becomes empty before it is
                                deleted. A value of 0 disables autokill.
                              format: int64
                              type: integer
                          type: object
                        autoscale:
                          description: |-
                            Indicates if the service has autoscale enabled.  See the associated
                            autoscale documentation for more information about how to set this up.
                            Autoscale policies can be set up after the service has been created.
                          type: boolean
                        created_at:
                          description: The time the service was created.
                          format: date-time
                          type: string
                        domains:
                          description: |-
                            List of domains associated with the service.  Domains are used to access
                            the service over the Internet.
                          items:
                            properties:
                              certificate:
                                properties:
                                  common_name:
                                    description: |-
                                      The common name (CN) field from the certificate's subject.

                                      This is typically the primary domain name that the certificate is issued
                                      for. It represents the main identity that the certificate validates.
                                    type: string
                                  created_at:
                                    description: The time the certificate was created.
                                    format: date-time
                                    type: string
                                  error:
                                    description: |-
                                      An optional error code providing additional information about the status.
                                      This field is only set when this message object is used as a response
                                      message, and is useful when the status is not `success`.
                                    format: int32
                                    type: integer
                                  issuer:
                                    description: |-
                                      The complete issuer distinguished name (DN) of the certificate.

                                      This identifies the Certificate Authority (CA) that issued the certificate.
                                      It contains information about the CA including its common name, organization,
                                      and country.
                                      Only present when the certificate has been issued.
                                    type: string
                                  message:
                                    description: |-
                                      An optional message providing additional information about the status.
                                      This field is only set when this message object is used as a response
                                      message, and is useful when the status is not `success`.
                                    type: string
                                  name:
                                    description: |-
                                      The name of the certificate.

                                      This is a human-readable name that can be used to identify the certificate.
                                      The name must be unique within the context of your account.  The name can
                                      also be used to identify the certificate in API calls.
                                    type: string
                                  not_after:
                                    description: |-
                                      The date and time when the certificate expires.

                                      The certificate should not be trusted after this date. This timestamp
                                      marks the end of the certificate's validity period. Certificates should
                                      be renewed before this date to maintain service availability.
                                      Only present when the certificate has been issued.
                                    format: date-time
                                    type: string
                                  not_before:
                                    description: |-
                                      The date and time when the certificate becomes valid.

                                      The certificate should not be trusted before this date. This timestamp
                                      marks the beginning of the certificate's validity period.
                                      Only present when the certificate has been issued.
                                    format: date-time
                                    type: string
                                  serial_number:
                                    description: |-
                                      The unique serial number assigned to the certificate by the issuing CA.

                                      This is a unique identifier within the scope of the issuing CA that can be
                                      used to identify and track the certificate. Serial numbers are typically
                                      represented as hexadecimal strings.
                                      Only present when the certificate has been issued.
                                    type: string
                                  state:
                                    description: |-
                                      The current state of the certificate.

                                      This indicates whether the certificate is pending issuance, valid and
                                      ready for use, or in an error state. See CertificateState enum for
                                      detailed state descriptions.
                                    enum:
                                    - pending
                                    - valid
                                    - error
                                    type: string
                                  status:
                                    description: |-
                                      An optional field representing the status of the request.  This field is
                                      only set when this message object is used as a response message.
                                    enum:
                                    - success
                                    - error
                                    - partial_success
                                    type: string
                                  subject:
                                    description: |-
                                      The complete subject distinguished name (DN) of the certificate.

                                      This contains the full subject information from the certificate, including
                                      the common name, organization, organizational unit, locality, state, and
                                      country. The subject identifies the entity that the certificate is issued to.
                                      Only present when the certificate has been issued.
                                    type: string
                                  uuid:
                                    description: |-
                                      The UUID of the certificate.

                                      This is a unique identifier for the certificate that is generated when the
                                      certificate is created.  The UUID is used to reference the certificate in
                                      API calls and can be used to identify the certificate in all API calls that
                                      require an identifier.
                                    type: string
                                required:
                                - common_name
                                - created_at
                                - name
                                - state
                                - uuid
                                type: object
                              fqdn:
                                description: |-
                                  Publicly accessible domain name.  If this name ends in a period `.` it must
                                  be a valid Full Qualified Domain Name (FQDN), otherwise it will become a
                                  subdomain of the target metro.
                                type: string
                            required:
                            - fqdn
                            type: object
                          type: array
                        error:
                          description: |-
                            An optional error code providing additional information about the status.
                            This field is only set when this message object is used as a response
                            message, and is useful when the status is not `success`.
                          format: int32
                          type: integer
                        hard_limit:
                          description: |-
                            The hard limit defines the maximum number of concurrent requests that an
                            instance assigned to the this service can handle.  The load balancer will
                            never assign more requests to a single instance.  In case there are no
                            other instances available, excess requests fail (i.e., they are blocked and
                            not queued).
                          format: int64
                          type: integer
                        instances:
                          description: List of instances assigned to the service.
                          items:
                            properties:
                              name:
                                description: |-
                                  The name of the instance.  This is a human-readable name that can be used
                                  to identify the instance.  The name must be unique within the context of
                                  your account.  If no name is specified, a random name is generated for
                                  you.  The name can also be used to identify the instance in API calls.
                                type: string
                              uuid:
                                description: |-
                                  The UUID of the instance.  This is a unique identifier for the instance
                                  that is generated when the instance is created.  The UUID is used to
                                  reference the instance in API calls and can be used to identify the
                                  instance in all API calls that require an instance identifier.
                                type: string
                            required:
                            - name
                            - uuid
                            type: object
                          type: array
                        message:
                          description: |-
                            An optional message providing additional information about the status.
                            This field is only set when this message object is used as a response
                            message, and is useful when the status is not `success`.
                          type: string
                        name:
                          description: |-
                            The name of the service group.

                            This is a human-readable name that can be used to identify the service
                            group. The name must be unique within the context of your account.  The
                            name can also be used to identify the service in API calls.
                          type: string
                        persistent:
                          description: |-
                            Indicates if the service will stay remain even after the last instance
                            detached.  If this is set to false, the service will be deleted when the
                            last instance detached from it.  If this is set to true, the service will
                            remain and can be reused by other instances.  This is useful if you want to
                            keep the service configuration, e.g., the published ports, handlers, and
                            domains, even if there are no instances assigned to it.
                          type: boolean
                        services:
                          description: |-
                            List of published network ports for this service and the destination port
                            to which Unikraft Cloud will forward traffic to.  Additional handlers can
                            be defined for each published port in order to define how the service will
                            handle incoming connections and forward traffic from the Internet to your
                            application.  For example, a service can be configured to terminate TLS
                            connections, redirect HTTP traffic, or enable HTTP mode for load balancing.
                          items:
                            properties:
                              destination_port:
                                description: |-
                                  The port number that the instance is listening on.  This is the internal
                                  port which Unikraft Cloud will forward traffic to.
                                format: int32
                                type: integer
                              handlers:
                                description: |-
                                  Connection handlers to use for the service.  Handlers define how the
                                  service will handle incoming connections and forward traffic from the
                                  Internet to your application.  For example, a service can be configured
                                  to terminate TLS connections, redirect HTTP traffic, or enable HTTP mode
                                  for load balancing.  You configure the handlers for every published
                                  service port individually.
                                items:
                                  description: "\tConnection handlers to use for the
                                    service.  Handlers define how the service\n\twill
                                    handle incoming connections and forward traffic
                                    from the Internet to\n\tyour application.  For
                                    example, a service can be configured to terminate
                                    TLS\n\tconnections, redirect HTTP traffic, or
                                    enable HTTP mode for load balancing.\n\tYou configure
                                    the handlers for every published service port
                                    individually.\n\n\tThere are currently 3 supported
                                    handlers:\n\n\t| Handler    | Description |\n\t|------------|-------------|\n\t|
                                    `tls`      | Terminate the TLS connection at the
                                    Unikraft Cloud gateway using our wildcard certificate
                                    issued for the kraft.cloud domain. The gateway
                                    forwards the unencrypted traffic to your application.
                                    |\n\t| `http`     | Enable HTTP mode on the load
                                    balancer to load balance on the level of individual
                                    HTTP requests. In this mode, only HTTP connections
                                    are accepted. If this option is not set the load
                                    balancer works in TCP mode and distributes TCP
                                    connections. |\n\t| `redirect` | Redirect traffic
                                    from the source port to the destination port.
                                    |\n\n\tNote that there is a set of constraints
                                    when publishing ports:\n\t- Port 80: MUST have
                                    \"http\" and MUST not have \"tls\" set;\n\t- Port
                                    443: MUST have http and tls set;\n\t- The `redirect`
                                    handler can only be set on port 80 (HTTP) to redirect
                                    to\n\t  port 443 (HTTPS);\n\t- All other ports
                                    MUST have tls and MUST not have http set."
                                  enum:
                                  - tls
                                  - http
                                  - redirect
                                  type: string
                                type: array
                              port:
                                description: |-
                                  This is the public-facing port that the service will be accessible from
                                  on the Internet.
                                format: int32
                                type: integer
                            required:
                            - port
                            type: object
                          type: array
                        soft_limit:
                          description: |-
                            The soft limit is used by the Unikraft Cloud load balancer to decide when
                            to wake up another standby instance.  For example, if the soft limit is set
                            to 5 and the service consists of 2 standby instances, one of the instances
                            receives up to 5 concurrent requests.  The 6th parallel requests wakes up
                            the second instance.  If there are no more standby instances to wake up,
                            the number of requests assigned to each instance will exceed the soft
                            limit.  The load balancer makes sure that when the number of in-flight
                            requests goes down again, instances are put into standby as fast as
                            possible.
                          format: int64
                          type: integer
                        status:
                          description: |-
                            An optional field representing the status of the request.  This field is
                            only set when this message object is used as a response message.
                          enum:
                          - success
                          - error
                          - partial_success
                          type: string
                        uuid:
                          description: |-
                            The UUID of the service group.

                            This is a unique identifier for the service group that is generated when
                            the service group is created.  The UUID is used to reference the service in
                            API calls and can be used to identify the service group in all API calls
                            that require an identifier.
                          type: string
                      required:
                      - autoscale
                      - created_at
                      - hard_limit
                      - name
                      - persistent
                      - soft_limit
                      - uuid
                      type: object
                    type: array
                type: object
              errors:
                description: A list of errors which may have occurred during the request.
                items:
                  properties:
                    status:
                      description: The HTTP status code of the error.
                      format: int64
                      type: integer
                  required:
                  - status
                  type: object
                type: array
              message:
                description: |-
                  An optional message providing additional information about the status.
                  This field is useful when the status is not `success`.
                type: string
              op_time_us:
                description: |-
                  The operation time in microseconds.  This is the time it took to process
                  the request and generate the response.
                format: int64
                type: integer
              status:
                description: The status of the response.
                enum:
                - success
                - error
                - partial_success
                type: string
            required:
            - op_time_us
            - status
            type: object
        type: object
    served: true
    storage: true
    subresources:
      status: {}
