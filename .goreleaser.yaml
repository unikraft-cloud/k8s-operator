project_name: k8s-operator
version: 2

builds:
  - id: k8s-operator
    binary: k8s-operator
    main: ./cmd
    ldflags:
      - -s
      - -w
      - -extldflags
      - -static-pie
      - -X unikraft.com/cli/internal/version.Version={{ .Version }}
      - -X unikraft.com/cli/internal/version.Commit={{ .Commit }}
      - -X unikraft.com/cli/internal/version.BuildTime={{ .Date }}
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

release:
  github:
    owner: unikraft-cloud
    name: k8s-operator
  prerelease: auto

dockers:
  - image_templates:
      - ghcr.io/unikraft-cloud/k8s-operator:{{ .Version }}-amd64
      - ghcr.io/unikraft-cloud/k8s-operator:latest
    dockerfile: Dockerfile
    use: buildx
    extra_files:
      - LICENSE.txt
    build_flag_templates:
      - --platform=linux/amd64
      - --label=org.opencontainers.image.source={{ .GitURL }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.version={{ .Version }}
  - image_templates:
      - ghcr.io/unikraft-cloud/k8s-operator:{{ .Version }}-arm64
      - ghcr.io/unikraft-cloud/k8s-operator:latest
    dockerfile: Dockerfile
    use: buildx
    extra_files:
      - LICENSE.txt
    build_flag_templates:
      - --platform=linux/arm64
      - --label=org.opencontainers.image.source={{ .GitURL }}
      - --label=org.opencontainers.image.revision={{ .FullCommit }}
      - --label=org.opencontainers.image.version={{ .Version }}

docker_manifests:
  - name_template: ghcr.io/unikraft-cloud/k8s-operator:{{ .Version }}
    image_templates:
      - ghcr.io/unikraft-cloud/k8s-operator:{{ .Version }}-amd64
      - ghcr.io/unikraft-cloud/k8s-operator:{{ .Version }}-arm64
  - name_template: ghcr.io/unikraft-cloud/k8s-operator:latest
    image_templates:
      - ghcr.io/unikraft-cloud/k8s-operator:{{ .Version }}-amd64
      - ghcr.io/unikraft-cloud/k8s-operator:{{ .Version }}-arm64


changelog:
  sort: asc
  use: github
  filters:
    include:
      - ^.*#[[:digit:]]+.*$
  groups:
    - title: ⚠️ Breaking Changes
      regexp: '^[[:xdigit:]]+: [[:lower:]]+(\(.*\))?!:.*$'
      order: 1
    - title: "\U0001F680 New Features"
      regexp: '^[[:xdigit:]]+: feat(\(.*\))?:.*$'
      order: 2
    - title: "\U0001F41B Bug Fixes"
      regexp: '^[[:xdigit:]]+: fix(\(.*\))?:.*$'
      order: 3
    - title: "\U0001F4D6 Docs"
      regexp: '^[[:xdigit:]]+: docs(\(.*\))?:.*$'
      order: 4
    - title: "\U0001F916 Bumps"
      regexp: '^[[:xdigit:]]+: (gomod|build)\(deps\):.*$'
      order: 5
    - title: "\U0001F412 Miscellaneous"
      order: 999
